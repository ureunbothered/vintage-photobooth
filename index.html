<div id="app">
  <h1 class="title">Photo Booth</h1>
  
  <div class="camera-wrapper">
    <video id="camera" autoplay></video>
    <div id="countdown"></div>
  </div>
  
  <input 
    type="text" 
    id="customText" 
    placeholder="Leave a message for Ure (max 60 characters)"
  />

  <!-- PREVIEW -->
  <div id="result"></div>

  <!-- BUTTONS BELOW PREVIEW -->
  <button class="primary" onclick="startSession()">Take Photos</button>
  <button class="secondary" id="downloadBtn" onclick="downloadStrip()" style="display:none;">Download Strip</button>
</div>
